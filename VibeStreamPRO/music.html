<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Page</title>
    <link rel="stylesheet" href="jeowah.css">
</head>
<body>

<header>
    <div class="nav-left">
        <div class="logo">
            <img src="Logo.jpg" alt="Logo">
        </div>
        <h1 class="neon-text">Akim MUSICS</h1>
    </div>
</header>

<main class="music-section">
    <h2>Owl City POPULAR SONGS</h2>

    <div class="music-card">
        <img src="music.jpg" alt="Fireflies">
        <div class="img-title">Fireflies</div>

        <audio id="audio-Fireflies" src="Fireflies.mp3"></audio>

        <div class="music-buttons">
            <button onclick="document.getElementById('audio-Fireflies').play()">Play</button>
            <button onclick="document.getElementById('audio-Fireflies').pause(); document.getElementById('audio-Fireflies').currentTime = 0;">Stop</button>
        </div>
    </div>

    <br>
    <a href="index.html" class="btn">Back to Home</a>
</main>

</body>
</html>
